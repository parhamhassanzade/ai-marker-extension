<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Test received</title>
  </head>
  <body>
    <div class="Workspace" style="display: none !important">
      <div style="display: contents">
        <main>
          <div
            data-chatgpt-search-unit-key="fallback-turn-0:0:user"
            data-chatgpt-search-message-ids="old-q"
          >
            <p>Stale hidden conversation</p>
          </div>
        </main>
      </div>
    </div>
    <div class="Workspace">
      <main>
        <header><button>Share</button></header>
        <div aria-label="Conversation">
          <div class="block-message">
            <h4 class="sr-only">You said:</h4>
            <div
              class="group/user-message"
              data-chatgpt-search-unit-key="fallback-turn-0:0:user"
              data-chatgpt-search-message-ids="live-q1"
            >
              <div data-content-search-unit-key="fallback-turn-0:0:user">test</div>
              <button>Copy message</button>
            </div>
          </div>
          <div
            class="block-message"
            data-content-search-unit-key="fallback-turn-0:2:assistant"
            data-chatgpt-search-unit-key="fallback-turn-0:2:assistant"
            data-chatgpt-search-message-ids="live-a1 live-a1"
          >
            <h4 class="sr-only">ChatGPT said:</h4>
            <p>Test received successfully.</p>
            <button>Copy</button><button>Regenerate</button>
          </div>
          <div class="block-message">
            <h4 class="sr-only">You said:</h4>
            <div
              data-chatgpt-search-unit-key="fallback-turn-0:3:user"
              data-chatgpt-search-message-ids="live-q2"
            >
              <div data-content-search-unit-key="fallback-turn-0:3:user">whats up</div>
              <button>Copy message</button>
            </div>
          </div>
          <div
            class="block-message"
            data-content-search-unit-key="fallback-turn-0:4:assistant"
            data-chatgpt-search-unit-key="fallback-turn-0:4:assistant"
            data-chatgpt-search-message-ids="live-a2 live-a2"
          >
            <h4 class="sr-only">ChatGPT said:</h4>
            <p>Not much — I’m here and ready. What are you working on?</p>
            <button>Copy</button><button>Read aloud</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
