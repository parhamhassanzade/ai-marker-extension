<!doctype html>
<!-- SYNTHETIC: image turns built from known ChatGPT patterns, not a live recording. -->
<html>
  <head>
    <title>Garden photos - ChatGPT</title>
  </head>
  <body>
    <main id="main">
      <div role="region" aria-label="Conversation">
        <article data-testid="conversation-turn-0" data-message-id="q1">
          <h5 class="sr-only">You said:</h5>
          <div data-message-author-role="user" data-message-id="q1">
            <div class="flex">
              <img
                src="https://files.oaiusercontent.com/file-upload1/photo.jpg?se=2026-10-22&amp;sig=SECRET"
                alt="Uploaded image"
                width="320"
                height="200"
              />
            </div>
            <div class="whitespace-pre-wrap">What is in this garden photo?</div>
          </div>
          <button>Copy message</button>
        </article>
        <article data-testid="conversation-turn-1" data-message-id="a1">
          <h6 class="sr-only">ChatGPT said:</h6>
          <div data-message-author-role="assistant" data-message-id="a1">
            <div class="prose">
              <p>Here is a sketch of the garden layout.</p>
              <div data-testid="image-gen">
                <img
                  src="https://chatgpt.com/backend-api/estuary/content?id=file-gen1&amp;ts=1&amp;sig=SECRET"
                  alt="Garden layout sketch"
                  width="320"
                  height="200"
                />
              </div>
              <p>The beds face south for more sun.</p>
            </div>
          </div>
          <button>Copy</button>
        </article>
        <article data-testid="conversation-turn-2" data-message-id="q2">
          <h5 class="sr-only">You said:</h5>
          <div data-message-author-role="user" data-message-id="q2">
            <div class="whitespace-pre-wrap">Show me tomato varieties.</div>
          </div>
        </article>
        <article data-testid="conversation-turn-3" data-message-id="a2">
          <h6 class="sr-only">ChatGPT said:</h6>
          <div data-message-author-role="assistant" data-message-id="a2">
            <div class="prose">
              <p>Popular varieties include cherry and beefsteak.</p>
              <div data-testid="image-carousel">
                <a href="https://garden.example/cherry">
                  <img
                    src="https://images.garden.example/cherry.jpg"
                    alt="Cherry tomatoes"
                    width="160"
                    height="120"
                  />
                </a>
                <a href="https://garden.example/beefsteak">
                  <img
                    src="https://images.garden.example/beefsteak.jpg"
                    alt="Beefsteak tomatoes"
                    width="160"
                    height="120"
                  />
                </a>
              </div>
              <p>
                Source
                <img
                  class="favicon"
                  src="https://garden.example/favicon.ico"
                  width="16"
                  height="16"
                  alt=""
                />
                garden.example
              </p>
            </div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
